name: Enterprise CI Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend-ci:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: Compile Production Bundle
        run: npm run build

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  backend-ci:
    name: Backend Unit Tests & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Execute Backend Unit & Integration Tests
        run: mvn test
        working-directory: ./backend

      - name: Package Backend JAR Artifact
        run: mvn package -DskipTests
        working-directory: ./backend

      - name: Upload Backend JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  security-scan:
    name: Dependency & Container Security Scan
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Frontend Dependency Vulnerability Audit
        run: npm audit --audit-level=high --production

      - name: Build Local Frontend Container Image
        run: docker build -t eagle-auctioner-frontend:ci -f Dockerfile .

      - name: Build Local Backend Container Image
        run: docker build -t eagle-auctioner-backend:ci -f backend/Dockerfile backend/

      - name: Trivy Container Image Vulnerability Scan (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'eagle-auctioner-frontend:ci'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Trivy Container Image Vulnerability Scan (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'eagle-auctioner-backend:ci'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'

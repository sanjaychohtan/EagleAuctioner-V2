services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: eagle-auctioner-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_prod_data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: eagle-auctioner-alertmanager
    restart: always
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: eagle-auctioner-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-adminpassword}
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_prod_data:/var/lib/grafana

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: eagle-auctioner-postgres-exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://${DATABASE_USERNAME:-postgres}:${DATABASE_PASSWORD:-password}@db:5432/${POSTGRES_DB:-eagleauctioner}?sslmode=disable"
    ports:
      - "9187:9187"

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: eagle-auctioner-redis-exporter
    restart: always
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${SPRING_DATA_REDIS_PASSWORD:-redispassword}"
    ports:
      - "9121:9121"

volumes:
  prometheus_prod_data:
  grafana_prod_data:

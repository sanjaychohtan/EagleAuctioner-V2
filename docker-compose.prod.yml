services:
  db:
    image: postgres:16-alpine
    container_name: eagle-auctioner-prod-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eagleauctioner}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${POSTGRES_DB:-eagleauctioner}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eagle-auctioner-prod-redis
    restart: always
    command: ["redis-server", "--requirepass", "${SPRING_DATA_REDIS_PASSWORD:-redispassword}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SPRING_DATA_REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eagle-auctioner-prod-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-eagleauctioner}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-redispassword}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace_with_a_secure_256_bit_base64_encoded_secret_key_in_production}
      APPLICATION_CORS_ALLOWED_ORIGINS: ${APPLICATION_CORS_ALLOWED_ORIGINS:-https://app.eagleauctioner.com,https://admin.eagleauctioner.com}
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload_prod_data:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eagle-auctioner-prod-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api

volumes:
  postgres_prod_data:
  redis_prod_data:
  upload_prod_data:

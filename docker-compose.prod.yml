x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16.2-alpine
    container_name: eagle-auctioner-prod-db
    restart: always
    stop_grace_period: 30s
    security_opt:
      - "no-new-privileges:true"
    environment:
      TZ: UTC
      POSTGRES_DB: ${POSTGRES_DB:-eagle_auctioner}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD environment variable is required}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${POSTGRES_DB:-eagle_auctioner}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging: *default-logging
    networks:
      - eagle_network

  redis:
    image: redis:7.2.4-alpine
    container_name: eagle-auctioner-prod-redis
    restart: always
    stop_grace_period: 30s
    security_opt:
      - "no-new-privileges:true"
    command: ["redis-server", "--requirepass", "${SPRING_DATA_REDIS_PASSWORD:?SPRING_DATA_REDIS_PASSWORD environment variable is required}"]
    environment:
      TZ: UTC
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SPRING_DATA_REDIS_PASSWORD:?SPRING_DATA_REDIS_PASSWORD environment variable is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    logging: *default-logging
    networks:
      - eagle_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    stop_grace_period: 30s
    security_opt:
      - "no-new-privileges:true"
    environment:
      TZ: UTC
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-eagle_auctioner}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD environment variable is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:?SPRING_DATA_REDIS_PASSWORD environment variable is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY environment variable is required}
      APPLICATION_CORS_ALLOWED_ORIGINS: ${APPLICATION_CORS_ALLOWED_ORIGINS:-https://app.eagleauctioner.com,https://admin.eagleauctioner.com}
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 3
    volumes:
      - upload_prod_data:/app/uploads
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.50'
          memory: 1024M
        reservations:
          cpus: '0.50'
          memory: 512M
    logging: *default-logging
    networks:
      - eagle_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    stop_grace_period: 30s
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: UTC
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    logging: *default-logging
    networks:
      - eagle_network

networks:
  eagle_network:
    name: eagle_network
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  upload_prod_data:

